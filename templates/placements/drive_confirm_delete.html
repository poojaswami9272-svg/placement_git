{% extends 'base.html' %}

{% block title %}Confirm Deletion - {{ drive.title }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 520px; margin-top: 40px;">
    <div class="card" style="padding: 36px; text-align: center;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--danger-light); color: var(--danger); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 16px;">
            <i class="fa-solid fa-trash"></i>
        </div>
        <h3 style="font-size: 1.4rem; margin-bottom: 8px;">Delete Placement Drive</h3>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">
            Are you sure you want to delete the placement drive for <strong>{{ drive.title }}</strong> at <strong>{{ drive.company.name }}</strong>?
        </p>

        <form method="post" style="display: flex; justify-content: center; gap: 12px;">
            {% csrf_token %}
            <a href="{% url 'drive_detail' drive.id %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, Delete Drive</button>
        </form>
    </div>
</div>
{% endblock %}
